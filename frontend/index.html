<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeOut - Découvrez Paris</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Idiqlat:wght@200;300;400&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <!-- Logo -->
            <div class="header-logo">
                <i class="fas fa-butterfly header-logo-icon"></i>
                <h1 class="header-title idiqlat-regular">BeOut</h1>
            </div>

            <!-- Barre de recherche -->
            <div class="header-search">
                <div class="search-wrapper">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Rechercher par nom, type ou ville (ex: Louvre, musée, Paris)..."
                        class="search-input"
                    >
                    <i class="fas fa-search search-icon"></i>
                </div>
            </div>

            <!-- Bouton favoris -->
            <div class="header-actions">
                <button id="favoritesBtn">
                    <i class="fas fa-heart"></i>
                    <span class="hide-mobile">Mes Favoris</span>
                    <span id="favCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Carte -->
    <div id="map"></div>

    <!-- Sidebar favoris -->
    <aside id="favoritesSidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">
                <i class="fas fa-heart"></i>Mes Favoris
            </h2>
            <button id="closeSidebar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="favoritesContent">
            <p class="fav-empty">Aucun favori pour le moment</p>
        </div>
    </aside>

    <!-- Toast notification -->
    <div id="toast">
        <span id="toastMessage">Action réussie !</span>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Scripts -->
    <script src="scripts/api.js"></script>
    <script src="scripts/map.js"></script>
</body>
</html>
