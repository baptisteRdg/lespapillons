<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeOut - Découvrez Paris</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <!-- Logo -->
            <div class="header-logo">
                <i class="fas fa-butterfly header-logo-icon"></i>
                <h1 class="header-title idiqlat-regular">BeOut</h1>
            </div>

            <!-- Barre de recherche -->
            <div class="header-search">
                <div class="search-wrapper">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Rechercher par nom, type ou ville (ex: Louvre, musée, Paris)..."
                        class="search-input"
                    >
                    <i class="fas fa-search search-icon"></i>
                </div>
            </div>

            <!-- Bouton favoris -->
            <div class="header-actions">
                <button id="favoritesBtn">
                    <i class="fas fa-heart"></i>
                    <span class="hide-mobile">Mes Favoris</span>
                    <span id="favCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Carte -->
    <div id="map"></div>

    <!-- Loader carte (non bloquant) -->
    <div id="map-loader">
        <div class="map-loader-spinner"></div>
        <span>Chargement…</span>
    </div>

    <!-- Sidebar favoris -->
    <aside id="favoritesSidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">
                <i class="fas fa-heart"></i>Mes Favoris
            </h2>
            <button id="closeSidebar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="favoritesContent">
            <p class="fav-empty">Aucun favori pour le moment</p>
        </div>
    </aside>

    <!-- Sélecteur de style de carte -->
    <div id="style-picker">
        <button id="style-picker-toggle" title="Changer le style de la carte">
            <i class="fas fa-layer-group"></i>
        </button>
        <div id="style-picker-panel">
            <div class="style-option" data-style="papillon">
                <span class="style-preview style-preview--papillon"></span>
                <span class="style-label">Papillon</span>
            </div>
            <div class="style-option" data-style="satellite">
                <span class="style-preview style-preview--satellite"></span>
                <span class="style-label">Satellite</span>
            </div>
            <div class="style-option" data-style="nuit">
                <span class="style-preview style-preview--nuit"></span>
                <span class="style-label">Nuit</span>
            </div>
            <div class="style-option" data-style="simple">
                <span class="style-preview style-preview--simple"></span>
                <span class="style-label">Simple</span>
            </div>
            <div class="style-option" data-style="propre">
                <span class="style-preview style-preview--propre"></span>
                <span class="style-label">Propre</span>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast">
        <span id="toastMessage">Action réussie !</span>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Scripts -->
    <script src="scripts/api.js"></script>
    <script src="scripts/map.js"></script>
</body>
</html>
